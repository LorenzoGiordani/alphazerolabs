name: deploy-dashboard

# Deploy istantaneo della dashboard pubblica su Cloudflare Pages
# (lux-ai.pages.dev) appena si cambia il frontend (template.html, dashboard.py)
# o su richiesta manuale. Non aspetta il paper-run orario, così i fix UI
# vanno online subito. Rigenera le pagine del sito multipagina (index.html +
# le sezioni + data.js) dai dati già committati e le deploya, come paper-run.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'scripts/dashboard.py'
      - 'paper/state.json'
      - 'paper/*.jsonl'
      - 'paper/backtests.json'
      - 'paper/health.json'
      - 'evidence/**'
      - 'strategies/**'

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_RUNTIME_DISABLED: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: install uv
        run: pip install -q uv

      - name: sync deps (uv)
        run: uv sync --frozen 2>/dev/null || uv sync

      - name: valida runtime health (fail-closed, max 2h)
        id: health
        continue-on-error: true
        run: uv run scripts/runtime_health.py validate paper/health.json --max-age-seconds 7200

      - name: rigenera le pagine dai dati correnti
        run: uv run scripts/dashboard.py

      - name: verifica release pubblica in pausa
        run: |
          test "$(jq -r '.state' dashboard/status.json)" = "stopped"
          test "$(jq -r '.summary.active' dashboard/status.json)" = "0"
          test "$(jq -r '.summary.candidates' dashboard/status.json)" = "0"
          test "$(jq -r '.features.propr.state' dashboard/status.json)" = "stopped"
          test "$(jq -r '.attestation_sha256' dashboard/status.json)" != "null"
          test "${{ steps.health.outcome }}" != "success" || \
            test "$(jq -r '.source.health_attestation_sha256' dashboard/status.json)" != "null"

      - name: verifica credenziali deploy
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: deploy dashboard pubblica (lux-ai.pages.dev)
        run: |
          mkdir -p /tmp/lux-deploy && cp dashboard/*.html dashboard/data.js dashboard/health.json dashboard/status.json dashboard/SKILL.md /tmp/lux-deploy/ && cp -R dashboard/assets /tmp/lux-deploy/assets
          rm -f /tmp/lux-deploy/template.html   # sorgente, non si pubblica
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg deployed_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '{schema_version:1, product:"AlphaZero Labs", git_commit:$commit, workflow_run_id:$run_id, deployed_at:$deployed_at, runtime_state:"stopped"}' \
            > /tmp/lux-deploy/release.json
          npx -y wrangler@4.107.0 pages deploy /tmp/lux-deploy \
            --project-name lux-ai \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "AlphaZero Product Truth release" \
            --commit-dirty=true
