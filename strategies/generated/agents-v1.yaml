thesis: >
  Prima strategia desk del progetto. Layer LLM (prima Claude, poi GPT-5) agisce
  come Portfolio Manager discrezionale: analizza il basket per setup confluenti
  (tsmom, vol_compression, funding_squeeze, vwap_zscore, range_breakout) usando
  il giudizio LLM per selezionare direzione e sizing, non per prevedere il prezzo.
  Gate: nessun gate sistematico formale — l'LLM valuta i segnali disponibili e
  decide se entrare. Falsificata se: non batte il benchmark buy&hold nel paper
  trading su rolling 30gg. Ritirata il 2026-07-25: creata prima dello schema YAML
  obbligatorio, sostituita da strategie desk con specifica formale (geopolitics-v1)
  e gate sistematico piu' rigoroso. Lo stato runtime in paper/state.json e' storico.
